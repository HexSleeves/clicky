name = "milo-proxy"
main = "src/index.ts"
# Bumped from 2024-01-01: Ed25519 verify in crypto.subtle landed
# non-experimentally on 2024-09-23. T0.2 install signature verification
# depends on it.
compatibility_date = "2024-10-01"

[vars]
ELEVENLABS_VOICE_ID = "CwhRBWXzGAHq8TQ4Fs17"

# Stage A install identity KV. Stores public keys keyed by install ID
# and per-day signature-outcome counters. Binding name MUST be uppercase
# to match src/install.ts's `env.INSTALLS`.
[[kv_namespaces]]
binding = "INSTALLS"
id      = "e09a5448c4da4db0aa2241ed85148cdf"

# No [[migrations]] block needed: this Worker was wiped and redeployed
# clean, so its migration ledger starts empty. Add v1 here when you
# introduce your first Durable Object class.
